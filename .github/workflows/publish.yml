# Builds the training page from Garmin and publishes it to GitHub Pages.
# Runs on every push to main and on demand: the Actions tab -> "Run workflow",
# or an outside timer (cron-job.org) calling the workflow_dispatch API.
# Needs the repo secret API_KEY (Settings -> Secrets and variables -> Actions).
name: Publish tracker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build page from Garmin
        run: python3 tracker.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TZ: America/Chicago  # so "today" and "updated" match your clock, not the server's
      - name: Prepare site
        run: mkdir _site && cp Result.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub sometimes can't see a just-uploaded artifact for a few seconds,
      # so deploy-pages fails with "No artifacts named github-pages were found"
      # (https://github.com/actions/deploy-pages/issues/451). Retry with waits
      # instead of failing; the extra steps only run if the previous try failed.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before final deploy try
        if: steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
