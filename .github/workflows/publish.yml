# Builds the training page from Garmin and publishes it to GitHub Pages.
# Runs every hour, on every push to main, and on demand (Actions tab -> "Run workflow").
# Needs the repo secret API_KEY (Settings -> Secrets and variables -> Actions).
name: Publish tracker

on:
  schedule:
    - cron: "17 * * * *"  # hourly at :17 (GitHub may run it a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build page from Garmin
        run: python3 tracker.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TZ: America/Chicago  # so "today" and "updated" match your clock, not the server's
      - name: Prepare site
        run: mkdir _site && cp Result.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
