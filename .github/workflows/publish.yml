# Builds the training page from Garmin and publishes it to GitHub Pages.
# Runs every hour, on every push to main, and on demand (Actions tab -> "Run workflow").
# Needs the repo secret API_KEY (Settings -> Secrets and variables -> Actions).
name: Publish tracker

on:
  schedule:
    - cron: "17 * * * *"  # hourly at :17 (GitHub may run it a few minutes late)
    - cron: "47 12 * * 1"  # weekly (Mon ~7 AM Central): also runs the keep-alive step below
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # lets the keep-alive step re-enable this workflow

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build page from Garmin
        run: python3 tracker.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TZ: America/Chicago  # so "today" and "updated" match your clock, not the server's
      - name: Prepare site
        run: mkdir _site && cp Result.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub pauses scheduled jobs in public repos after 60 days without commits.
      # Re-enabling the workflow once a week resets that clock, so it keeps running through race day.
      - name: Keep schedule alive
        if: github.event.schedule == '47 12 * * 1' || github.event_name == 'workflow_dispatch'
        run: gh workflow enable publish.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
